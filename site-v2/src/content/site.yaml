main:
  name: Kyle Wong
  tagline: Deconstructing the complex. Building the exceptional.
  location: ""

  socials:
    email: kyleyhw@gmail.com
    github: https://github.com/kyleyhw
    linkedin: https://www.linkedin.com/in/kyle-wong-a95030281/

  # Relative path under the site's BASE_URL. The CV PDF is fetched
  # at build time by scripts/fetch-cv.mjs (most recently updated
  # file from kyleyhw/kyle_wong_cv) and written to public/cv.pdf,
  # which GitHub Pages serves with `Content-Disposition: inline` —
  # so the link opens the PDF in a browser tab rather than
  # forcing a download.
  cv_url: cv.pdf

  github_username: kyleyhw

  # CV-ordered featured projects, top of the list to bottom. The sync
  # script (scripts/fetch-github-repos.mjs) iterates this list, fetches
  # each public repo via the GitHub REST API, and writes a markdown
  # entry under src/content/projects/. Slugs that already have a
  # `manual: true` markdown file (e.g. private repos like
  # `mercury_strategies`) are skipped by the fetcher; their handcrafted
  # frontmatter — including a high `priority` value — keeps them on top.
  #
  # Repos pinned on the GitHub profile but NOT listed here are appended
  # below this list, in profile-pin order. Duplicates between cv_repos
  # and pinned (matched by `html_url`) are removed.
  cv_repos:
    - mercury_strategies
    - quant_core
    - agent-evolve
